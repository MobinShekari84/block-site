<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <!-- Minimalist White Theme Floor Plan (Placeholder for DWG) -->
  <rect width="1000" height="800" fill="#fafafa"/>
  <!-- Outer Walls -->
  <path d="M 100 100 L 900 100 L 900 700 L 100 700 Z" fill="none" stroke="#333" stroke-width="4"/>
  <!-- Inner Walls -->
  <path d="M 400 100 L 400 400 L 900 400" fill="none" stroke="#333" stroke-width="2"/>
  <path d="M 100 400 L 400 400" fill="none" stroke="#333" stroke-width="2"/>
  <path d="M 700 400 L 700 700" fill="none" stroke="#333" stroke-width="2"/>
  <!-- Doors -->
  <path d="M 400 150 Q 450 150 450 200" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4"/>
  <path d="M 400 150 L 450 200" fill="none" stroke="#333" stroke-width="2"/>
  
  <!-- Room Labels -->
  <text x="250" y="250" font-family="sans-serif" font-size="24" fill="#999" text-anchor="middle">LIVING AREA</text>
  <text x="650" y="250" font-family="sans-serif" font-size="24" fill="#999" text-anchor="middle">KITCHEN</text>
  <text x="250" y="550" font-family="sans-serif" font-size="24" fill="#999" text-anchor="middle">MASTER BEDROOM</text>
  <text x="800" y="550" font-family="sans-serif" font-size="24" fill="#999" text-anchor="middle">TERRACE</text>
</svg>
